<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taller Plan Estratégico Logístico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de trabajo por clases — barra superior con la empresa y el avance, ruta de 12 talleres a la izquierda, formato del taller a la derecha */
:root{
  --sena:#39A900;--sena-deep:#2a7d00;--sena-soft:#e9f6df;--sand:#f3efe6;--bg:#f7f8f4;--card:#fff;--fg:#17201a;--muted:#56635a;--line:#d9dfd3;
  --sea:#0f6e8c;--sun:#e39b1b;--alert:#c2412d;--alert-soft:#fbe9e5;--violet:#6b4fa3;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;--mono:"JetBrains Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sena:#5cc91f;--sena-deep:#7ad94a;--sena-soft:#1d2b16;--sand:#22261f;--bg:#121612;--card:#1a1f1a;--fg:#eef2ea;--muted:#a6b2a3;--line:#2f382d;--sea:#4fb3d3;--sun:#f0b44a;--alert:#ef7a63;--alert-soft:#2e1d19;--violet:#a98ee0;color-scheme:dark}}
:root[data-theme="dark"]{--sena:#5cc91f;--sena-deep:#7ad94a;--sena-soft:#1d2b16;--sand:#22261f;--bg:#121612;--card:#1a1f1a;--fg:#eef2ea;--muted:#a6b2a3;--line:#2f382d;--sea:#4fb3d3;--sun:#f0b44a;--alert:#ef7a63;--alert-soft:#2e1d19;--violet:#a98ee0;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--display);line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:clamp(1.9rem,4vw,2.8rem)}h2{font-size:clamp(1.5rem,3vw,2.1rem)}h3{font-size:1.25rem}
p{margin:0}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sena-deep)}
.muted{color:var(--muted)}.note{font-size:.88rem;color:var(--muted)}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.2rem}
.brand i{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--sena);color:#fff;font-style:normal;font-size:.95rem}
.co{flex:1;min-width:200px;display:flex;flex-direction:column}
.co b{font-family:var(--display);font-size:1.15rem}
.prog{display:flex;align-items:center;gap:10px;min-width:180px}
.bar{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden;min-width:100px}
.bar span{display:block;height:100%;background:var(--sena);transition:width .3s}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:9px;padding:7px 12px;font-weight:700;font-size:.9rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--sena);border-color:var(--sena);color:#fff}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.btn.mail{background:var(--sea);border-color:var(--sea);color:#fff}
.btn.dl{background:var(--violet);border-color:var(--violet);color:#fff}

/* layout */
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;padding-block:20px;padding-inline:16px;max-width:1320px;margin:0 auto}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
nav.route{display:flex;flex-direction:column;gap:6px;align-self:start;position:sticky;top:84px}
@media (max-width:900px){nav.route{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.rt{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);min-width:0}
@media (max-width:900px){.rt{min-width:220px}}
.rt .num{grid-row:span 2;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.1rem;background:var(--sand);color:var(--muted)}
.rt .t{font-weight:700;font-size:.92rem;line-height:1.2}
.rt .d{font-size:.75rem;color:var(--muted);font-family:var(--mono)}
.rt.on{border-color:var(--sena);box-shadow:inset 4px 0 0 var(--sena)}
.rt.done .num{background:var(--sena);color:#fff}
.rt.ph{border-style:dashed}
.phase{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}
@media (max-width:900px){.phase{display:none}}

main{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,2vw,22px);display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{border-top:8px solid var(--c,var(--sena))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 10px;border-radius:999px;background:var(--sena-soft);color:var(--sena-deep);font-weight:700;font-size:.8rem}
.chip.alt{background:var(--sand);color:var(--muted)}
.prod{padding:12px 14px;border-radius:10px;background:var(--sena-soft)}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);width:32px;height:32px;border-radius:8px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.1rem}
.tip{padding:10px 14px;border-radius:10px;border:1px dashed var(--sun);background:color-mix(in srgb,var(--sun) 8%,var(--card))}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-weight:700}
.field .help{font-size:.85rem;color:var(--muted)}
input[type=text],input[type=number],textarea,select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
textarea{min-height:84px;resize:vertical}
.tw{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
table.f{border-collapse:collapse;width:100%;min-width:620px}
table.f th{background:var(--sena);color:#fff;text-align:left;font-family:var(--display);font-size:1rem;padding:7px 8px;font-weight:700}
table.f td{border-top:1px solid var(--line);padding:5px;vertical-align:top}
table.f td.rl{font-weight:700;padding:8px;background:var(--sand);width:15%}
table.f td input,table.f td textarea{min-height:0;padding:6px 8px;font-size:.92rem}
table.f td textarea{min-height:52px}
table.f td.calc{font-family:var(--mono);font-weight:500;color:var(--sena-deep);padding:9px 8px;white-space:nowrap}
.calcbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.res div{padding:10px 12px;border-radius:10px;background:var(--sena-soft)}
.res b{display:block;font-family:var(--mono);font-size:1.3rem;color:var(--sena-deep)}
.cls{display:inline-block;padding:1px 9px;border-radius:999px;font-weight:700;font-size:.8rem}
.cls.A{background:var(--alert);color:#fff}.cls.B{background:var(--sun);color:#17201a}.cls.C{background:var(--line);color:var(--fg)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:999px;font-weight:700;z-index:20}
.agenda{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.agenda div{padding:8px 10px;border-radius:10px;background:var(--sand);font-size:.88rem}
.agenda b{display:block;font-family:var(--mono);font-size:.8rem;color:var(--sena-deep)}
.maptbl{width:100%;border-collapse:collapse;min-width:560px}
.maptbl th,.maptbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;font-size:.92rem}
.maptbl th{background:var(--sena);color:#fff;font-family:var(--display);font-size:1rem}
footer.f{color:var(--muted);font-size:.85rem;padding:16px;text-align:center;border-top:1px solid var(--line)}

/* plan compilado */
.doc{background:var(--card);color:var(--fg)}
.doc h2{margin-top:18px;border-bottom:3px solid var(--sena);padding-bottom:4px}
.doc h3{margin-top:12px;color:var(--sena-deep)}
.doc table{border-collapse:collapse;width:100%;margin:6px 0 10px;font-size:.9rem}
.doc th,.doc td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.doc th{background:var(--sena-soft)}
.doc .empty{color:var(--alert);font-style:italic}
/* código de entrega */
.codebox{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:10px;border:2px dashed var(--sena);background:var(--sena-soft)}
.codebox textarea{font-family:var(--mono);font-size:.74rem;min-height:72px;word-break:break-all;background:var(--card)}
.codehead{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:space-between;align-items:baseline}
.warn{color:var(--alert);font-weight:700}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.sent{font-size:.85rem;color:var(--sena-deep);font-weight:700}

/* diagrama de la cadena */
.chainwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff;-webkit-overflow-scrolling:touch}
.chainwrap svg{display:block;width:100%;min-width:820px;height:auto}

/* zona instructor */
.mx{border-collapse:collapse;width:100%;min-width:780px}
.mx th,.mx td{border:1px solid var(--line);padding:4px;text-align:center;font-size:.85rem}
.mx th{background:var(--sena);color:#fff;font-family:var(--display);font-size:.95rem;font-weight:700}
.mx td.tm{text-align:left;padding:6px 8px;min-width:200px}
.mx td.tm small{display:block;color:var(--muted)}
.cell{width:100%;min-width:38px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-weight:800;font-family:var(--mono);padding:0}
.cell.p{background:var(--sun);border-color:var(--sun);color:#17201a}
.cell.r{background:color-mix(in srgb,var(--sun) 30%,var(--card));border-color:var(--sun);color:var(--fg)}
.cell.A{background:var(--sena);border-color:var(--sena);color:#fff}
.cell.D{background:var(--alert);border-color:var(--alert);color:#fff}
.cell.on{outline:3px solid var(--fg);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:16px;height:16px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.ihead{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.isplit{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:1000px){.isplit{grid-template-columns:1fr}}
.evalbox{position:sticky;top:84px;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
@media (max-width:1000px){.evalbox{position:static}}
.evalbox .ck{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.evalbox input[type=checkbox]{width:20px;height:20px;accent-color:var(--sena);flex:none;margin-top:2px}
.jz{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.jz button{padding:9px 4px;border:1px solid var(--line);border-radius:8px;font-weight:800;background:var(--card);color:var(--fg)}
.jz button.sel[data-j="A"]{background:var(--sena);border-color:var(--sena);color:#fff}
.jz button.sel[data-j="D"]{background:var(--alert);border-color:var(--alert);color:#fff}
.jz button.sel[data-j=""]{background:var(--sun);border-color:var(--sun);color:#17201a}
.ok{color:var(--sena-deep);font-weight:700}.late{color:var(--alert);font-weight:700}
.prevev{padding:8px 10px;border-radius:8px;background:var(--sand);font-size:.85rem}
@media print{.top,nav.route,.noprint,footer.f{display:none!important}.wrap{display:block;padding:0}.card{border:0;padding:0}body{background:#fff;color:#000}}
.ident{display:grid;gap:8px;padding:12px 14px;border-radius:12px;border:2px solid var(--sena);background:var(--sena-soft);margin-bottom:12px}
.join{display:grid;gap:6px;padding:10px 12px;border-radius:10px;border:1px dashed var(--sun);margin:8px 0}
.gstate{margin-top:12px;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
.gstate .ghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gstate .gico{font-size:1.5rem;line-height:1}
.gstate .gtit{font-weight:800;font-size:1.05rem}
.gstate .gsub{margin:6px 0 0;color:var(--muted);font-size:.9rem}
.gstate .gcrit{margin:10px 0 0;display:grid;gap:4px;font-size:.9rem}
.gstate .gobs{margin:10px 0 0;padding:10px 12px;border-radius:9px;background:var(--sand);font-size:.92rem;white-space:pre-wrap}
.gstate .gfoot{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gstate.ok{border-color:var(--sena);background:var(--sena-soft)}
.gstate.ok .gtit{color:var(--sena-deep)}
.gstate.bad{border-color:var(--alert);background:var(--alert-soft)}
.gstate.bad .gtit{color:var(--alert)}
.gstate.rev{border-color:var(--sea)}
.gstate.rev .gtit{color:var(--sea)}
.gstate.pend{border-color:var(--sun)}
.gstate.pend .gtit{color:var(--sun)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i>LL</i>LogiLab SENA</div>
  <div class="co"><span class="eyebrow">Plan Estratégico Logístico de</span><b id="coName">— escojan su empresa en la clase 1 —</b></div>
  <div class="prog"><div class="bar"><span id="progBar" style="width:0%"></span></div><span class="note" id="progTxt">0/12</span></div>
  <label class="btn" for="fImpTop" title="Cargar un respaldo .json descargado antes">⬆ Cargar respaldo</label><input type="file" id="fImpTop" accept=".json,application/json" hidden>
  <button class="btn" id="goPlan">📄 Mi plan</button>
</header>

<div class="wrap">
  <nav class="route" id="route" aria-label="Ruta de talleres"></nav>
  <main id="main"></main>
</div>
<footer class="f">LogiLab SENA · Gestión Logística · Competencia 210101007 · <b>By Carlos Barrios · Instructor</b> · <a href="../../">← Portal</a> · <a href="#instructor" id="lnkInstr">Zona instructor</a></footer>

const KEY='pel-v1';
let S={v:1,d:{},done:{},wa:'',mail:'',sent:{},tid:''};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}

/* ======== BUZÓN EN LA NUBE (Netlify /api/plan) ======== */
const API='https://logilab-sena.netlify.app/api/plan';
function bindSend(btnId,msgId,kind,getCode,check){const b=document.getElementById(btnId),m=document.getElementById(msgId);if(!b)return;
  b.onclick=async()=>{if(check&&!check())return;const code=getCode();b.disabled=true;const old=b.textContent;b.textContent='Enviando…';m.textContent='';
    try{const r=await fetch(API,{method:'POST',headers:{'content-type':'text/plain;charset=utf-8'},body:JSON.stringify({codigo:code,taller:kind,equipo:(val('T1','equipo')||'').trim(),empresa:empresa()})});
      let j={};try{j=await r.json()}catch(e){}
      if(!r.ok)throw new Error(j.error||('Error '+r.status));
      S.cloud=S.cloud||{};S.cloud[kind]=Date.now();S.sent[kind]=Date.now();
      try{const x=readCode(code);if(x&&x.p){S.csid=S.csid||{};S.csid[kind]=kind+'|'+teamKey(x.p)+'|'+(x.p.ts||0)}}catch(e){}
      save();
      m.innerHTML=`<span class="sent">✅ Recibido por el instructor: ${fdate(S.cloud[kind])}</span>`;toast('¡Entregado al instructor!');
      checkGrade(kind,kind==='PLAN'?'pGradeBox':'gradeBox')}
    catch(e){m.innerHTML=`<span class="warn">No se pudo enviar (${esc(e.message==='Failed to fetch'?'sin conexión':e.message)}). Usen Copiar código, WhatsApp o correo.</span>`}
    finally{b.disabled=false;b.textContent=old}};
}
/* ======== ESTADO DE LA ENTREGA (nota del instructor) ======== */
/* El equipo consulta SOLO su propia entrega por el sid exacto que guardó al enviar (kind|dispositivo|ts).
   No necesita la clave de docente: el backend (GET /api/plan?ev=<sid>) devuelve únicamente ese juicio. */
function gradeView(e){
  if(!e)return {cls:'pend',ico:'⏳',tit:'Enviado · falta la nota del instructor',sub:'Su entrega ya llegó. Cuando el instructor la califique, aquí verán el resultado y las observaciones. Toquen 🔄 Actualizar nota para revisar.',crit:false};
  if(e.j==='A')return {cls:'ok',ico:'✅',tit:'Aprobado (A)',sub:'¡Bien hecho! Este entregable quedó aprobado.',crit:true};
  if(e.j==='D')return {cls:'bad',ico:'❌',tit:'No aprobado (D) · corrijan y reenvíen',sub:'Lean las observaciones, corrijan el formato en esta misma clase y vuelvan a tocar 📤 Enviar al instructor: la versión corregida le llega de nuevo.',crit:true};
  return {cls:'rev',ico:'🔎',tit:'En revisión',sub:'El instructor abrió su entrega y la está revisando.',crit:true};
}
function gradeHtml(kind,boxId,e){
  const g=gradeView(e);
  const crit=g.crit&&e&&e.cr?`<div class="gcrit">${CRIT.map(([k,l])=>`<div>${e.cr[k]?'✅':'⬜'} ${esc(l)}</div>`).join('')}</div>`:'';
  const obs=e&&e.obs?`<div class="gobs"><b>Observaciones del instructor:</b>\n${esc(e.obs)}</div>`:'';
  const when=e&&e.at?`<span class="note">Actualizado: ${fdate(e.at)}</span>`:'';
  return `<div class="ghead"><span class="gico">${g.ico}</span><span class="gtit">${esc(g.tit)}</span></div>
  <p class="gsub">${esc(g.sub)}</p>${crit}${obs}
  <div class="gfoot"><button class="btn" id="gRef-${boxId}">🔄 Actualizar nota</button>${when}</div>`;
}
async function checkGrade(kind,boxId){boxId=boxId||'gradeBox';const box=document.getElementById(boxId);if(!box)return;
  const tid=S.tid;const yaEnvio=(S.csid&&S.csid[kind])||(S.cloud&&S.cloud[kind]);
  if(!tid||!yaEnvio){box.hidden=true;box.innerHTML='';box.className='gstate';return}
  box.hidden=false;
  if(!box.innerHTML)box.innerHTML='<p class="gsub">🔄 Consultando la nota del instructor…</p>';
  let e=null,fail=false;
  try{const r=await fetch(API+'?dev='+encodeURIComponent(tid));const j=await r.json();const evs=j.ev||{};
    const pre=kind+'|'+tid+'|';let bt=-1;  // de este dispositivo, la última versión enviada de esta clase
    for(const sid in evs){if(sid.indexOf(pre)===0){const ts=+sid.slice(pre.length)||0;if(ts>=bt){bt=ts;e=evs[sid]}}}}
  catch(err){fail=true}
  if(fail){box.className='gstate pend';box.innerHTML=`<div class="ghead"><span class="gico">📡</span><span class="gtit">No se pudo consultar ahora</span></div><p class="gsub">Sin conexión. Toquen 🔄 Actualizar nota cuando tengan internet.</p><div class="gfoot"><button class="btn" id="gRef-${boxId}">🔄 Actualizar nota</button></div>`}
  else{box.className='gstate '+gradeView(e).cls;box.innerHTML=gradeHtml(kind,boxId,e)}
  const rb=document.getElementById('gRef-'+boxId);if(rb)rb.onclick=()=>checkGrade(kind,boxId);
}

function loadBackupInput(ev){const file=ev.target.files[0];ev.target.value='';if(!file)return;

function campo(tid,c){
  const id=tid+'-'+c.k;
  if(c.type==='text')return `<label class="field"><span class="lbl">${c.l}</span><input type="text" id="${id}" data-k="${c.k}" placeholder="${esc(c.ph||'')}" value="${esc(val(tid,c.k)||'')}"></label>`;

  if(c.type==='table')return tableField(tid,c);
  if(c.type==='abc')return abcField(tid,c);
  if(c.type==='rop')return ropField(tid,c);
  if(c.type==='chain')return `<div class="field"><span class="lbl">${c.l} <span class="chip">se dibuja solo</span></span><span class="help">Se arma con la tabla de eslabones y los 4 flujos. Cada cambio que escriban aparece aquí. Descárguenlo para el papelógrafo y el informe ICONTEC.</span><div class="chainwrap" id="chainBox">${chainSvg(S.d[tid]||{},empresa())}</div><div class="acts"><button class="btn pri" id="bPng">⬇ Diagrama en imagen (.png)</button><button class="btn" id="bSvg">⬇ Diagrama editable (.svg)</button></div></div>`;
  return '';
}
function rowsOf(c){return c.rowLabels?c.rowLabels.length:c.rows}
function tableField(tid,c){
  const data=val(tid,c.k)||[];const n=rowsOf(c);
  let h=`<div class="field"><span class="lbl">${c.l}</span>${c.help?`<span class="help">${c.help}</span>`:''}<div class="tw"><table class="f" data-t="${c.k}"><thead><tr>${c.cols.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>`;
  for(let r=0;r<n;r++){h+='<tr>';c.cols.forEach((col,ci)=>{
    if(c.rl&&ci===0){h+=`<td class="rl">${c.rowLabels[r]}</td>`;return}
    if(c.calc&&ci===c.calc.t){h+=`<td class="calc" data-r="${r}">—</td>`;return}
    const v=(data[r]||[])[ci]||'';const ph=(c.ph&&r===0)?(c.ph[ci]||''):'';
    const isNum=c.num&&c.num.includes(ci);
    h+=isNum?`<td><input type="text" inputmode="decimal" data-r="${r}" data-c="${ci}" value="${esc(v)}" placeholder="${esc(ph)}"></td>`:`<td><textarea data-r="${r}" data-c="${ci}" placeholder="${esc(ph)}">${esc(v)}</textarea></td>`});h+='</tr>'}
  return h+'</tbody></table></div></div>';
}
function calcRow(c,row){
  const g=i=>num((row||[])[i]);
  if(c.calc.op==='sum'){const s=c.calc.c.map(g);return s.some(isNaN)&&s.every(isNaN)?'—':s.filter(x=>!isNaN(x)).reduce((a,b)=>a+b,0)}
  if(c.calc.op==='div'){const a=g(c.calc.c[0]),b=g(c.calc.c[1]);if(isNaN(a)||isNaN(b)||b===0)return '—';const r=a/b;return c.k==='bc'?r.toFixed(2)+(r>=1?' ✅':' ⚠️'):money(r)}
  if(c.calc.op==='sub'){const a=g(c.calc.c[0]),b=g(c.calc.c[1]);if(isNaN(a)&&isNaN(b))return '—';return money((isNaN(a)?0:a)-(isNaN(b)?0:b))}
  return '—';
}
function abcField(tid,c){
  const data=val(tid,c.k)||[];
  let h=`<div class="field"><span class="lbl">${c.l}</span><span class="help">Escriban 10 productos. La app calcula el resto y ordena por valor.</span><div class="tw"><table class="f" data-abc="1"><thead><tr><th>Producto</th><th>Unidades al mes</th><th>Costo unitario ($)</th></tr></thead><tbody>`;
  for(let r=0;r<c.rows;r++){const row=data[r]||[];h+=`<tr><td><input type="text" data-r="${r}" data-c="0" value="${esc(row[0]||'')}" placeholder="${r===0?'Ej.: Pan francés':''}"></td><td><input type="text" inputmode="decimal" data-r="${r}" data-c="1" value="${esc(row[1]||'')}"></td><td><input type="text" inputmode="decimal" data-r="${r}" data-c="2" value="${esc(row[2]||'')}"></td></tr>`}
  return h+`</tbody></table></div><div class="tw"><table class="f" id="abcOut"></table></div></div>`;
}
function abcCalc(data){
  const items=(data||[]).map(r=>({p:(r||[])[0],u:num((r||[])[1]),c:num((r||[])[2])})).filter(x=>x.p&&!isNaN(x.u)&&!isNaN(x.c)).map(x=>({...x,v:x.u*x.c})).sort((a,b)=>b.v-a.v);
  const tot=items.reduce((a,b)=>a+b.v,0);let acc=0;
  items.forEach(x=>{const pct=tot?x.v/tot*100:0;const before=acc;acc+=pct;x.pct=pct;x.acc=acc;x.cl=(acc<=80||before===0)?'A':acc<=95?'B':'C'});
  return {items,tot};
}
function drawAbc(tid){
  const o=document.getElementById('abcOut');if(!o)return;const {items,tot}=abcCalc(val(tid,'abc'));
  if(!items.length){o.innerHTML='<tbody><tr><td class="note" style="padding:10px">Aquí aparece la clasificación cuando escriban productos con unidades y costo.</td></tr></tbody>';return}
  o.innerHTML=`<thead><tr><th>Producto</th><th>Valor al mes ($)</th><th>% del valor</th><th>% acumulado</th><th>Clase</th></tr></thead><tbody>${items.map(x=>`<tr><td style="padding:8px">${esc(x.p)}</td><td class="calc">${money(x.v)}</td><td class="calc">${x.pct.toFixed(1)} %</td><td class="calc">${x.acc.toFixed(1)} %</td><td style="padding:8px"><span class="cls ${x.cl}">${x.cl}</span></td></tr>`).join('')}<tr><td style="padding:8px"><b>Total</b></td><td class="calc">${money(tot)}</td><td colspan="3"></td></tr></tbody>`;
}
function ropField(tid,c){

  return `<div class="field"><span class="lbl">${c.l}</span><span class="help">Stock de seguridad = demanda diaria × días de protección. Punto de reorden = demanda diaria × tiempo de entrega + stock de seguridad.</span>

  <div class="res" id="ropOut"></div></div>`;
}
function ropCalc(d){d=d||{};const dd=num(d.dd),lt=num(d.lt),ds=num(d.ds);if([dd,lt,ds].some(isNaN))return null;const ss=dd*ds;return {ss,rop:dd*lt+ss}}
function drawRop(tid){const o=document.getElementById('ropOut');if(!o)return;const r=ropCalc(val(tid,'rop'));o.innerHTML=r?`<div><span>Stock de seguridad</span><b>${money(r.ss)} und.</b></div><div><span>Punto de reorden</span><b>${money(r.rop)} und.</b></div><div><span>Regla</span><b style="font-size:1rem;font-family:var(--body)">Pedir cuando queden ${money(r.rop)} unidades</b></div>`:'<div><span class="note">Llenen los tres datos para ver el resultado.</span></div>'}

function fieldText(tid,c){
  const v=val(tid,c.k);

  if(c.type==='table'){const n=rowsOf(c);let s=`${c.l}:\n`;for(let r=0;r<n;r++){const row=(v||[])[r]||[];const cells=c.cols.map((col,ci)=>{if(c.rl&&ci===0)return c.rowLabels[r];if(c.calc&&ci===c.calc.t)return calcRow(c,row);return row[ci]||''});if(cells.slice(c.rl?1:0).some(x=>x&&x!=='—'))s+='- '+c.cols.map((col,ci)=>`${col}: ${cells[ci]||'—'}`).join(' | ')+'\n'}return s}

function fieldHtml(tid,c,D,emp){

  if(c.type==='rop'){const d=v||{};const r=ropCalc(d);return `<h3>${c.l}</h3>`+(r?`<table><tbody><tr><th>Producto</th><td>${esc(d.p||'')}</td></tr><tr><th>Demanda diaria</th><td>${esc(d.dd)}</td></tr><tr><th>Tiempo de entrega (días)</th><td>${esc(d.lt)}</td></tr><tr><th>Días de protección</th><td>${esc(d.ds)}</td></tr><tr><th>Stock de seguridad</th><td>${money(r.ss)}</td></tr><tr><th>Punto de reorden</th><td>${money(r.rop)}</td></tr></tbody></table>`:E)}
  return '';
}

/* ======== CÓDIGO DE ENTREGA ======== */
/* Formato: LLPE.<clase>.<Z|B><control>.<contenido>~  (Z = comprimido lz-string, B = base64 de respaldo) */
function fdate(ts){try{return new Date(ts).toLocaleString('es-CO',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}catch(e){return String(ts)}}
function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return ('000000'+h.toString(36)).slice(-6)}
function b64u(str){return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(b){b=b.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';return decodeURIComponent(escape(atob(b)))}
function makeCode(kind,payload){const json=JSON.stringify(payload);let f='Z',body='';try{body=LZString.compressToEncodedURIComponent(json);if(!body)throw 0}catch(e){f='B';body=b64u(json)}return `LLPE.${kind}.${f}${fnv(body)}.${body}~`}
function readCode(raw){
  raw=String(raw||'').replace(/\s+/g,'');if(raw.includes('%'))try{raw=decodeURIComponent(raw)}catch(e){}
  raw=raw.replace(/~$/,'');
  const m=/^LLPE\.([A-Z0-9]{1,5})\.([ZB])([0-9a-z]{6})\.(.+)$/.exec(raw);
  if(!m)return {err:'formato'};
  const kind=m[1],f=m[2],chk=m[3],body=m[4];
  if(fnv(body)!==chk)return {err:'dañado',kind};

  <p class="muted" style="max-width:76ch">Lo que los equipos envían con <b>📤 Enviar al instructor</b> llega a la nube: toque <b>Traer entregas</b>. Sus evaluaciones también se guardan en la nube, así puede calificar desde el computador o el celular. Si alguien le manda el código por WhatsApp o correo, péguelo aquí (varios a la vez o el chat completo).</p>
  <textarea id="iPaste" style="min-height:110px;font-family:var(--mono);font-size:.8rem" placeholder="Pegue aquí uno o varios códigos: LLPE.T2.Z…~"></textarea>
  <div class="acts"><button class="btn pri" id="iOpen">Abrir códigos</button><label class="btn" for="iFile">⬆ Cargar chat exportado de WhatsApp (.txt)</label><input type="file" id="iFile" accept=".txt,text/plain" multiple hidden><span class="note" id="iMsg"></span></div></section>
  <section class="card"><div class="ihead"><div><h2>Tablero de entregas</h2><p class="note" id="iSum"></p></div>
  <div class="acts"><button class="btn pri" id="iNextTop">Evaluar siguiente →</button><button class="btn" id="iCsv">⬇ Notas para Excel (.csv)</button><button class="btn dl" id="iExp">⬇ Respaldo</button><label class="btn" for="iImp">⬆ Cargar respaldo</label><input type="file" id="iImp" accept=".json,application/json" hidden><button class="btn" id="iClear">Borrar todo</button></div></div>
  <div class="legend"><span><i style="background:var(--sun)"></i>● Por evaluar</span><span><i style="background:color-mix(in srgb,var(--sun) 30%,var(--card))"></i>↻ Reenvío tras corrección</span><span><i style="background:var(--sena)"></i>A · Aprobado</span><span><i style="background:var(--alert)"></i>D · No aprobado</span><span><i></i>· Sin entregar</span></div>
  <div class="tw" id="iBoard"></div></section>
  <section class="card" id="iDetail" hidden></section>`;
  const msg=document.getElementById('iMsg');
  const report=r=>{if(!r.n){msg.innerHTML='<span class="warn">No encontré códigos LLPE en ese texto.</span>';return}
    msg.innerHTML=`<b>${r.nu} nueva${r.nu===1?'':'s'}</b> · ${r.dup} repetida${r.dup===1?'':'s'}`+(r.bad?` · <span class="warn">${r.bad} dañada${r.bad===1?'':'s'}: pida al equipo reenviar con "Copiar código"</span>`:'');
    renderBoard();if(r.last&&(r.n===1||r.nu===1))openSub(r.last)};
  document.getElementById('iPull').onclick=()=>cloudPull(true);
  document.getElementById('iKey').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();cloudPull(true)}};
  document.getElementById('iKeyShow').onclick=()=>{const f=document.getElementById('iKey');f.type=f.type==='password'?'text':'password'};
  document.getElementById('iKeyChg').onclick=()=>{try{localStorage.removeItem(CKEY)}catch(e){}document.getElementById('iKeyBox').hidden=false;document.getElementById('iKey').focus();setCloud('Escriba la clave y toque <b>Traer entregas</b>')};
  document.getElementById('iOpen').onclick=()=>{const ta=document.getElementById('iPaste');const r=importText(ta.value);if(r.n&&!r.bad)ta.value='';report(r)};
  document.getElementById('iFile').onchange=ev=>{const fs=[...ev.target.files];if(!fs.length)return;let all='',k=0;fs.forEach(f=>{const rd=new FileReader();rd.onload=()=>{all+='\n'+rd.result;if(++k===fs.length)report(importText(all))};rd.readAsText(f)});ev.target.value=''};
  document.getElementById('iBack').onclick=()=>{location.hash=''};
  document.getElementById('iLock').onclick=lockInstr;
  document.getElementById('iNextTop').onclick=()=>nextPending(null);
  document.getElementById('iCsv').onclick=exportCsv;
  document.getElementById('iExp').onclick=()=>download(JSON.stringify(I),'respaldo-instructor-plan-estrategico.json','application/json');
  document.getElementById('iImp').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||!o.subs)throw 0;Object.assign(I.subs,o.subs);Object.assign(I.ev,o.ev||{});I.alias=Object.assign(I.alias||{},o.alias||{});isave();renderBoard();toast('Respaldo cargado')}catch(e){toast('Ese archivo no es un respaldo de la zona instructor')}};rd.readAsText(f);ev.target.value=''};
  document.getElementById('iClear').onclick=()=>{if(!confirm('¿Borrar todas las entregas y evaluaciones de este dispositivo? Descargue antes el respaldo.'))return;I={subs:{},ev:{},alias:{}};isel=null;isave();document.getElementById('iDetail').hidden=true;renderBoard()};
  renderBoard();instrHash();if(ckey())cloudPull(false);else setCloud('☁ Escriba su clave de docente y toque <b>Traer entregas</b>');
}
function instrHash(){if(!location.hash.startsWith('#c='))return;let c=location.hash.slice(3);try{c=decodeURIComponent(c)}catch(e){}const r=importText(c);try{history.replaceState(null,'','#instructor')}catch(e){}renderBoard();if(r.last)openSub(r.last);else toast('El código del enlace está dañado')}
function renderBoard(){const box=document.getElementById('iBoard');if(!box)return;const ts=teams();
  document.getElementById('iSum').textContent=`${ts.length} equipo${ts.length===1?'':'s'} · ${Object.keys(I.subs).length} entregas recibidas · ${pendingList().length} por evaluar`;
  if(!ts.length){box.innerHTML='<p class="note" style="padding:14px">Aún no hay entregas. Pegue arriba los códigos que le enviaron.</p>';return}
  box.innerHTML=`<table class="mx"><thead><tr><th>Equipo · Empresa</th>${T.map((t,i)=>`<th title="${esc(t.t)}">${i+1}</th>`).join('')}<th>Plan</th></tr></thead><tbody>${ts.map(t=>`<tr><td class="tm" title="${esc(t.q)}"><b>${esc(teamShort(t.q)||'Equipo sin nombre')}</b><small>${esc(t.e||'Empresa sin definir')}</small></td>${KINDS.map(k=>{const a=t.by[k];if(!a)return `<td><span class="cell" style="display:grid;place-items:center">·</span></td>`;const s=cellState(a);return `<td><button class="cell ${s.c}${a.some(x=>x.sid===isel)?' on':''}" data-sid="${esc(a[0].sid)}" title="${esc(kindName(k))}${a.length>1?' · '+a.length+' versiones':''}">${s.t}</button></td>`}).join('')}</tr>`).join('')}</tbody></table>`;
  box.querySelectorAll('[data-sid]').forEach(b=>b.onclick=()=>openSub(b.dataset.sid))}
/* Reconstruye el respaldo .json del EQUIPO (shape de la app del aprendiz) a partir de lo recibido,
   para devolvérselo si perdieron el suyo: trae todos los talleres, su identidad (tid) y deja
   visibles las notas ya puestas (csid/cloud) para que puedan corregir y reenviar. */
function teamBackup(sid){const base=I.subs[sid];if(!base)return null;const key=gk(base);
  const subs=Object.values(I.subs).filter(x=>gk(x)===key);
  let tid=base.team;if(/^x-/.test(tid||'')){const r=subs.filter(x=>x.team&&!/^x-/.test(x.team)).sort((a,b)=>b.ts-a.ts)[0];if(r)tid=r.team}
  const latest={};subs.forEach(x=>{if(!latest[x.kind]||latest[x.kind].ts<x.ts)latest[x.kind]=x});
  const S0={v:1,tid:tid||'',wa:'',mail:'',sent:{},cloud:{},csid:{},done:{},d:{}};
  const plan=latest.PLAN;if(plan){Object.assign(S0.d,plan.d||{});Object.assign(S0.done,plan.done||{})}
  Object.keys(latest).forEach(k=>{if(k==='PLAN')return;const x=latest[k];if(!plan||x.ts>=plan.ts){S0.d[k]=x.d||{};S0.done[k]=!!x.done}});
  Object.keys(latest).forEach(k=>{S0.csid[k]=latest[k].sid;S0.cloud[k]=latest[k].ts||latest[k].recv||Date.now()});
  const g=teams().find(t=>t.key===key)||{};S0.d.T1=S0.d.T1||{};
  if(!S0.d.T1.empresa&&(base.e||g.e))S0.d.T1.empresa=base.e||g.e;
  if(!S0.d.T1.equipo&&(base.q||g.q))S0.d.T1.equipo=base.q||g.q;
  return S0}
function openSub(sid){const s=I.subs[sid];if(!s)return;isel=sid;renderBoard();const grp=teams().find(t=>t.key===gk(s))||{q:'',e:''};
  const vers=Object.values(I.subs).filter(x=>gk(x)===gk(s)&&x.kind===s.kind).sort((a,b)=>b.ts-a.ts);
  const prev=vers.filter(x=>x.sid!==sid&&x.ts<s.ts).map(x=>({x,ev:I.ev[x.sid]})).find(o=>o.ev&&(o.ev.j||o.ev.obs));
  const t=T.find(x=>x.id===s.kind);const ev=I.ev[sid]||{j:'',cr:{},obs:''};const li=lateInfo(s.kind,s.ts);
  const content=s.kind==='PLAN'?planBody(s.d||{}):`<div class="doc">${t.campos.map(c=>fieldHtml(t.id,c,s.d||{},s.e)).join('')}</div>`;
  const det=document.getElementById('iDetail');det.hidden=false;
  det.innerHTML=`<div class="chips"><span class="chip">${esc(kindName(s.kind))}</span>${t?`<span class="chip alt">Evidencia ${t.ev}</span>`:''}<span class="chip alt">Formato lleno: ${subComp(s)} %</span><span class="chip alt">${s.kind==='PLAN'?'':(s.done?'El equipo lo marcó terminado':'No lo marcaron terminado')}</span></div>
  <h2>${esc(teamShort(s.q)||teamShort(grp.q)||'Equipo sin nombre')} · ${esc(s.e||grp.e||'Empresa sin definir')}</h2>${s.q?`<p class="muted">${esc(s.q)}</p>`:''}
  <div class="join"><label class="field"><span class="lbl">${s.q&&s.e?'Esta entrega pertenece a':'⚠ Esta entrega llegó sin equipo o sin empresa. ¿De qué equipo es?'}</span>
  <select id="iJoin"><option value="">${esc(natKey(s)===s.team?'Equipo propio (como llegó)':'Según el número de equipo escrito')}</option>${teams().filter(t=>t.key!==natKey(s)).map(t=>`<option value="${esc(t.key)}"${(I.alias[s.team]||{}).to===t.key?' selected':''}>${esc(teamShort(t.q)||'Sin nombre')} · ${esc(t.e||'sin empresa')}</option>`).join('')}</select></label>
  <span class="note">Une todas las entregas enviadas desde ese mismo dispositivo con el equipo que escoja.</span></div>
  <p>Enviado: <b>${fdate(s.ts)}</b>${li?` · <span class="${li.late?'late':'ok'}">${li.txt}</span>`:''}</p>
  ${vers.length>1?`<label class="field" style="max-width:440px"><span class="lbl">Versiones recibidas (${vers.length})</span><select id="iVer">${vers.map((v,k)=>`<option value="${esc(v.sid)}"${v.sid===sid?' selected':''}>${k===0?'Más reciente · ':''}${fdate(v.ts)}${(I.ev[v.sid]||{}).j?' · juicio '+I.ev[v.sid].j:''}</option>`).join('')}</select></label>`:''}
  <div class="isplit"><div class="card" style="padding:14px">${content}</div>
  <aside class="evalbox"><h3>Evaluación</h3>
  ${prev?`<div class="prevev"><b>Versión anterior:</b> juicio ${prev.ev.j||'pendiente'}${prev.ev.obs?' · '+esc(prev.ev.obs):''}</div>`:''}
  ${CRIT.map(([k,l])=>`<label class="ck"><input type="checkbox" data-cr="${k}"${ev.cr&&ev.cr[k]?' checked':''}><span>${l}</span></label>`).join('')}
  <span style="font-weight:700">Juicio evaluativo</span>
  <div class="jz"><button data-j="A" title="Aprobado">✓ A</button><button data-j="D" title="No aprobado">✗ D</button><button data-j="" title="Sin juicio todavía">Pendiente</button></div><span class="note">A = aprobado · D = no aprobado (corrigen y reenvían)</span>
  <label class="field"><span class="lbl">Observaciones para el equipo</span><textarea id="iObs" placeholder="Qué está bien, qué deben corregir y para cuándo">${esc(ev.obs||'')}</textarea></label>
  <div class="acts"><button class="btn" id="iFbCopy">📋 Copiar retroalimentación</button><a class="btn wa" id="iFbWa" href="#" target="_blank" rel="noopener">WhatsApp</a></div>
  <div class="acts"><button class="btn dl" id="iTeamJson">⬇ Respaldo .json para el equipo</button></div>
  <p class="note">Si el equipo perdió su respaldo: descárguelo y envíeselo (WhatsApp/correo). Ellos lo abren con <b>⬆ Cargar respaldo</b> y recuperan todo su trabajo —con su nota ya visible— para corregir y reenviar.</p>
  <div class="acts"><button class="btn pri" id="iNext">Siguiente por evaluar →</button><button class="btn" id="iDel">Eliminar entrega</button></div>
  <p class="note">Se guarda solo en este dispositivo y en la nube.</p></aside></div>`;
  document.getElementById('iJoin').onchange=e=>{I.alias[s.team]={to:e.target.value,at:Date.now()};isave();renderBoard();openSub(sid);cloudPush();toast(e.target.value?'Entregas unidas al equipo':'Unión quitada')};
  const E=()=>I.ev[sid]=I.ev[sid]||{j:'',cr:{},obs:''};
  const upd=()=>{E().at=Date.now();isave();renderBoard();cloudPush()};
  det.querySelectorAll('[data-cr]').forEach(c=>c.onchange=()=>{const e=E();e.cr=e.cr||{};e.cr[c.dataset.cr]=c.checked;upd()});
  const jb=det.querySelectorAll('.jz button');const markJ=j=>jb.forEach(b=>b.classList.toggle('sel',b.dataset.j===j));markJ(ev.j||'');
  jb.forEach(b=>b.onclick=()=>{E().j=b.dataset.j;markJ(b.dataset.j);upd()});
  const ob=document.getElementById('iObs');ob.oninput=()=>{const e=E();e.obs=ob.value;e.at=Date.now();isave();cloudPush()};
  const fb=()=>{const e=I.ev[sid]||{};return `Retroalimentación LogiLab · ${kindName(s.kind)}\nEmpresa: ${s.e||'—'}\nEquipo: ${teamShort(s.q)||'—'}\nEntrega del ${fdate(s.ts)}\n\nJuicio: ${e.j==='A'?'A · Aprobado':e.j==='D'?'D · No aprobado: corrijan y reenvíen el código':'En revisión'}\n${CRIT.map(([k,l])=>`${e.cr&&e.cr[k]?'✅':'⬜'} ${l}`).join('\n')}\n\nObservaciones: ${e.obs||'—'}\n\nCarlos Barrios · Instructor SENA`};
  document.getElementById('iTeamJson').onclick=()=>{const b=teamBackup(sid);if(!b){toast('No pude armar el respaldo');return}
    const nom=slugOf((b.d.T1&&b.d.T1.empresa)||teamShort(s.q)||'equipo');
    download(JSON.stringify(b,null,1),'respaldo-equipo-'+nom+'.json','application/json')};
  document.getElementById('iFbCopy').onclick=()=>copy(fb(),'Retroalimentación copiada');
  document.getElementById('iFbWa').onclick=e=>{e.currentTarget.href='https://wa.me/?text='+encodeURIComponent(fb())};
  document.getElementById('iNext').onclick=()=>nextPending(sid);
  document.getElementById('iDel').onclick=()=>{if(!confirm('¿Eliminar esta entrega y su evaluación?'))return;delete I.subs[sid];I.ev[sid]={del:true,at:Date.now()};isel=null;isave();det.hidden=true;renderBoard();cloudPush()};
  const vs=document.getElementById('iVer');if(vs)vs.onchange=()=>openSub(vs.value);
  det.scrollIntoView({behavior:'smooth',block:'start'});
}
function exportCsv(){const rows=[['Equipo','Integrantes','Empresa','Entrega','Evidencia','Enviado','Oportunidad','Formato lleno %','Versiones','Juicio','Criterios cumplidos','Observaciones']];
  teams().forEach(t=>KINDS.forEach(k=>{const a=t.by[k];if(!a)return;const s=a[0];const tt=T.find(x=>x.id===k);const e=I.ev[s.sid]||{};const li=lateInfo(k,s.ts);
    rows.push([teamShort(s.q),s.q,s.e,kindName(k),tt?tt.ev:'3.3.5 · 3.4',fdate(s.ts),li?li.txt:'',subComp(s),a.length,e.j||'Pendiente',CRIT.filter(([c])=>e.cr&&e.cr[c]).length+'/'+CRIT.length,e.obs||''])}));
  if(rows.length<2){toast('Aún no hay entregas para exportar');return}
  download(rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""').replace(/\r?\n/g,' ')+'"').join(';')).join('\r\n'),'evaluacion-plan-estrategico.csv','text/csv')}

/* ======== UTILIDADES ======== */
function copy(s,m){m=m||'Texto copiado';if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>toast(m),()=>fb(s,m));else fb(s,m)}
function fb(s,m){const ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(m||'Texto copiado')}catch(e){toast('Seleccione y copie el texto manualmente')}setTimeout(()=>ta.remove(),100)}
function download(content,name,type){try{const b=new Blob([(type==='application/json'?'':'\ufeff')+content],{type:type+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Descarga iniciada')}catch(e){toast('No se pudo descargar: use Copiar texto')}}

/* ======== ARRANQUE: taller del equipo o zona instructor (#instructor) ======== */
const isInstr=()=>/^#(instructor|c=)/.test(location.hash);
const MODE=isInstr();
window.addEventListener('hashchange',()=>{if(isInstr()!==MODE){location.reload();return}if(MODE&&unlocked())instrHash()});
if(MODE)instructorApp();
else{refreshTop();
let start='INICIO';try{start=localStorage.getItem(KEY+'-cur')||'INICIO'}catch(e){}
if(!(start==='INICIO'||start==='PLAN'||T.some(t=>t.id===start)))start='INICIO';
go(start);}
})();
</script>
</body></html>
